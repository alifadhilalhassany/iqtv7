<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>IQ TV | البث المباشر</title>
    
    <!-- خطوط جوجل (Cairo + Inter للغة العربية والأرقام/إنجليزية) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
    
    <!-- مكتبة الأيقونات FontAwesome 6.5.0 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        :root {
            --primary: #FF0033;
            --primary-glow: rgba(255, 0, 51, 0.35);
            --bg-dark: #07080b;
            --bg-card: #10121a;
            --bg-card-hover: #161924;
            --surface-glass: rgba(18, 21, 31, 0.6);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-glass-bright: rgba(255, 255, 255, 0.18);
            --text-main: #ffffff;
            --text-sub: #9ca3af;
            --radius-xl: 20px;
            --radius-lg: 14px;
            --radius-md: 10px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            line-height: 1.5; 
            min-height: 100vh;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, rgba(255, 0, 51, 0.08) 0%, transparent 60%);
        }

        /* سكرول بار أنيق */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        /* الهيدر الرئيسي */
        header {
            background: rgba(7, 8, 11, 0.85);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            padding: 12px 6%;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid var(--border-glass);
        }

        /* تنسيق اللوغو باستخدام الصورة الخاصة بك */
        .brand-logo { 
            display: flex; 
            align-items: center; 
            text-decoration: none; 
            transition: var(--transition);
        }
        .brand-logo:hover {
            transform: scale(1.03);
        }
        .brand-logo img {
            height: 38px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.4));
        }

        .status-pill {
            background: rgba(255, 0, 51, 0.1); border: 1px solid rgba(255, 0, 51, 0.25);
            padding: 5px 14px; border-radius: 30px; font-size: 12px; font-weight: 700; color: #ff4d6d;
            display: flex; align-items: center; gap: 8px;
        }
        .pulse-dot { width: 8px; height: 8px; background: var(--primary); border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,0,51,0.7); } 70% { box-shadow: 0 0 0 8px rgba(255,0,51,0); } 100% { box-shadow: 0 0 0 0 rgba(255,0,51,0); } }

        /* الحاوية الرئيسية */
        .container { max-width: 1300px; margin: 0 auto; padding: 25px 20px; }

        /* شريط التبويب والبحث */
        .toolbar {
            display: flex; justify-content: space-between; align-items: center; gap: 15px;
            margin-bottom: 30px; background: var(--surface-glass);
            border: 1px solid var(--border-glass); padding: 8px; border-radius: var(--radius-xl);
            backdrop-filter: blur(10px);
        }

        .tabs-group { display: flex; gap: 4px; background: rgba(0,0,0,0.3); padding: 4px; border-radius: var(--radius-lg); }
        .tab-btn {
            background: transparent; border: none; color: var(--text-sub);
            padding: 8px 22px; border-radius: var(--radius-md); font-weight: 700; font-size: 13px;
            cursor: pointer; transition: var(--transition); display: flex; align-items: center; gap: 6px;
        }
        .tab-btn.active { background: var(--primary); color: #fff; box-shadow: 0 4px 14px var(--primary-glow); }

        .search-box { position: relative; flex: 1; max-width: 360px; }
        .search-box input {
            width: 100%; background: rgba(0, 0, 0, 0.35); border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg); padding: 9px 12px 9px 38px; color: #fff; font-size: 13px;
            outline: none; transition: var(--transition);
        }
        .search-box input:focus { border-color: var(--primary); box-shadow: 0 0 12px rgba(255,0,51,0.2); }
        .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-sub); font-size: 13px; }

        /* شبكة عرض القنوات */
        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 18px;
        }

        .channel-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-xl);
            padding: 16px;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            cursor: pointer; transition: var(--transition); position: relative;
            overflow: hidden; height: 160px;
        }

        .channel-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-glass-bright);
            transform: translateY(-4px);
            box-shadow: 0 12px 28px rgba(0,0,0,0.4);
        }

        .fav-btn {
            position: absolute; top: 10px; left: 10px;
            background: rgba(0,0,0,0.3); border: 1px solid var(--border-glass);
            color: var(--text-sub); width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: var(--transition); z-index: 2; font-size: 13px;
        }
        .fav-btn:hover, .fav-btn.active { color: #ffc107; background: rgba(0,0,0,0.6); }

        .logo-container {
            width: 100%; flex: 1; display: flex; align-items: center; justify-content: center; padding: 10px 0;
        }
        .logo-container img {
            max-width: 110px; max-height: 55px; object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4)); transition: var(--transition);
        }
        .channel-card:hover .logo-container img { transform: scale(1.08); }

        .channel-title {
            width: 100%; text-align: center; border-top: 1px solid var(--border-glass);
            padding-top: 10px; font-size: 13px; font-weight: 700; color: #fff;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* المشغل المنبثق الكامل (Modal Overlay) */
        .player-modal {
            position: fixed; inset: 0; background: rgba(3, 4, 6, 0.96);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            z-index: 2000; display: none; flex-direction: column; opacity: 0; transition: opacity 0.3s ease;
        }
        .player-modal.open { display: flex; opacity: 1; }

        .modal-header {
            padding: 16px 3%; display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.3); border-bottom: 1px solid var(--border-glass);
        }

        .channel-meta { display: flex; align-items: center; gap: 10px; }
        .channel-meta h3 { font-size: 16px; font-weight: 800; color: #fff; }

        .close-player-btn {
            background: rgba(255, 255, 255, 0.08); border: 1px solid var(--border-glass); color: #fff;
            width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: var(--transition); font-size: 16px;
        }
        .close-player-btn:hover { background: var(--primary); border-color: var(--primary); transform: rotate(90deg); box-shadow: 0 0 16px var(--primary-glow); }

        .modal-body { flex: 1; display: flex; align-items: center; justify-content: center; padding: 10px; }

        .video-box {
            width: 100%; max-width: 1100px; aspect-ratio: 16 / 9; background: #000;
            border-radius: var(--radius-xl); overflow: hidden; box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            border: 1px solid var(--border-glass); position: relative;
        }
        #player { width: 100%; height: 100%; }

        /* شريط تحكم عائم في الأسفل داخل المشغل */
        .floating-controls {
            padding: 14px; display: flex; justify-content: center; gap: 12px;
            background: rgba(0,0,0,0.4); border-top: 1px solid var(--border-glass);
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border-glass); color: #fff;
            padding: 8px 18px; border-radius: 30px; font-size: 13px; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; gap: 8px; transition: var(--transition);
        }
        .control-btn:hover { background: var(--primary); border-color: var(--primary); box-shadow: 0 4px 12px var(--primary-glow); }

        footer { text-align: center; padding: 25px; border-top: 1px solid var(--border-glass); margin-top: 50px; color: var(--text-sub); font-size: 13px; }

        /* التجاوب والتنسيق للهواتف الذكية */
        @media (max-width: 768px) {
            header { padding: 12px 4%; }
            .brand-logo img { height: 32px; }
            .toolbar { flex-direction: column; align-items: stretch; background: transparent; border: none; padding: 0; gap: 12px; }
            .search-box { max-width: 100%; }
            .tabs-group { width: 100%; }
            .tab-btn { flex: 1; justify-content: center; padding: 10px; }

            .channels-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .channel-card { height: 135px; padding: 12px; border-radius: var(--radius-lg); }
            .logo-container img { max-width: 80px; max-height: 40px; }
            .channel-title { font-size: 11px; padding-top: 6px; }

            .modal-header { padding: 12px 16px; }
            .modal-header h3 { font-size: 14px; }
            .close-player-btn { width: 36px; height: 36px; font-size: 14px; }
            
            .modal-body { padding: 0; }
            .video-box { border-radius: 0; border: none; aspect-ratio: 16/9; }
            .floating-controls { padding: 10px; }
            .control-btn { padding: 6px 14px; font-size: 11px; border-radius: 20px; }
        }
    </style>
</head>
<body>

    <!-- شاشة المشغل المنبثقة -->

            <button class="control-btn" onclick="reloadActiveStream()"><i class="fa-solid fa-rotate-right"></i> إعادة تحديث</button>

    <!-- مشغل Clappr JS -->
    <script src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>

    <script>
        // حماية الشفرة والمفاتيح
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('keydown', event => {
            if (
                event.key === 'F12' || 
                (event.ctrlKey && event.shiftKey && (event.key === 'I' || event.key === 'J' || event.key === 'C')) || 
                (event.ctrlKey && event.key === 'U')
            ) {
                event.preventDefault();
                return false;
            }
            if (event.key === 'Escape') closePlayer();
        });

        let player = null;
        let currentChannelId = null;
        let currentTab = 'all';
        let favorites = JSON.parse(localStorage.getItem('iq_tv_favs')) || [];

        window.onload = () => {
            updateFavoritesUI();
        };

        const channelCards = Array.from(document.querySelectorAll('.channel-card'));

        async function openPlayer(channelId) {
            currentChannelId = channelId;
            const card = document.querySelector(`.channel-card[data-id="${channelId}"]`);
            if (!card) return;

            const apiUrl = card.getAttribute('data-url');
            const title = card.getAttribute('data-title');
            const modal = document.getElementById('playerModal');
            const modalTitle = document.getElementById('modalChannelTitle');

            modalTitle.innerText = `${title} (جاري الاتصال...)`;
            modal.classList.add('open');

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data && data.data && data.data.length > 0 && data.data[0].url) {
                    const rawUrl = data.data[0].url;
                    const proxyUrl = "https://iqtv-proxy.aaa317198.workers.dev?stream=" + encodeURIComponent(rawUrl);

                    modalTitle.innerText = title;

                    if (player) player.destroy();

                    player = new Clappr.Player({
                        source: proxyUrl,
                        mimeType: 'application/x-mpegURL',
                        parentId: "#player",
                        width: '100%',
                        height: '100%',
                        autoPlay: true,
                        playback: {
                            playInline: true,
                            hlsjsConfig: {
                                maxMaxBufferLength: 25,
                                fragLoadingTimeOut: 45000,
                                manifestLoadingTimeOut: 45000,
                                fragLoadingMaxRetry: 10
                            }
                        }
                    });

                } else {
                    modalTitle.innerText = `${title} (البث غير متوفر حالياً)`;
                }
            } catch (err) {
                console.error(err);
                modalTitle.innerText = `${title} (خطأ في شبكة البث)`;
            }
        }

        function closePlayer() {
            const modal = document.getElementById('playerModal');
            modal.classList.remove('open');
            if (player) {
                player.destroy();
                player = null;
            }
        }

        function navigateChannel(direction) {
            const visibleCards = channelCards.filter(c => c.style.display !== 'none');
            const currentIndex = visibleCards.findIndex(c => c.getAttribute('data-id') === currentChannelId);
            
            if (currentIndex === -1) return;

            let nextIndex = direction === 'next' 
                ? (currentIndex + 1) % visibleCards.length 
                : (currentIndex - 1 + visibleCards.length) % visibleCards.length;

            openPlayer(visibleCards[nextIndex].getAttribute('data-id'));
        }

        function reloadActiveStream() {
            if (currentChannelId) openPlayer(currentChannelId);
        }

        function toggleFavorite(e, channelId) {
            e.stopPropagation();
            const index = favorites.indexOf(channelId);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(channelId);
            }
            localStorage.setItem('iq_tv_favs', JSON.stringify(favorites));
            updateFavoritesUI();
            if (currentTab === 'fav') renderTabsContent();
        }

        function updateFavoritesUI() {
            document.querySelectorAll('.channel-card').forEach(card => {
                const id = card.getAttribute('data-id');
                const btn = card.querySelector('.fav-btn');
                const icon = btn.querySelector('i');
                if (favorites.includes(id)) {
                    icon.className = "fa-solid fa-star";
                    btn.classList.add('active');
                } else {
                    icon.className = "fa-regular fa-star";
                    btn.classList.remove('active');
                }
            });
        }

        function switchTab(tab, btnEl) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btnEl.classList.add('active');
            renderTabsContent();
        }

        function renderTabsContent() {
            channelCards.forEach(card => {
                const id = card.getAttribute('data-id');
                card.style.display = (currentTab === 'fav') 
                    ? (favorites.includes(id) ? "flex" : "none") 
                    : "flex";
            });
        }

        function filterChannelsQuery() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            channelCards.forEach(card => {
                const name = card.getAttribute('data-name');
                const matchesSearch = name.includes(query);
                const matchesTab = currentTab === 'all' || favorites.includes(card.getAttribute('data-id'));
                
                card.style.display = (matchesSearch && matchesTab) ? "flex" : "none";
            });
        }
    </script>
</body>
</html>
