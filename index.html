<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IQ TV | البث التلفزيوني الرقمي المتطور</title>
    
    <!-- خطوط جوجل العالمية -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- مكتبة الأيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --iq-red: #FF0033;
            --iq-red-glow: rgba(255, 0, 51, 0.4);
            --bg-base: #07080c;
            --bg-surface: #0e1017;
            --glass-bg: rgba(18, 21, 31, 0.7);
            --glass-border: rgba(255, 255, 255, 0.07);
            --text-main: #ffffff;
            --text-muted: #949ab0;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-base); color: var(--text-main); line-height: 1.6; overflow-x: hidden; }
        
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: var(--iq-red); border-radius: 3px; }

        /* الهيدر المتجاوب */
        header {
            background: rgba(7, 8, 12, 0.9);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 12px 4%; display: flex; justify-content: space-between;
            align-items: center; position: sticky; top: 0; z-index: 1000;
            border-bottom: 1px solid var(--glass-border);
        }
        
        .logo { font-size: 24px; font-weight: 900; letter-spacing: 0.5px; display: flex; align-items: center; gap: 4px; direction: ltr; }
        .logo .iq-text { color: #fff; }
        .logo .tv-badge { background: var(--iq-red); color: #fff; padding: 1px 7px; border-radius: 6px; font-size: 18px; box-shadow: 0 0 12px var(--iq-red-glow); }

        .live-badge-global { background: rgba(255, 0, 51, 0.12); border: 1px solid rgba(255, 0, 51, 0.3); padding: 5px 12px; border-radius: 30px; font-size: 12px; font-weight: 700; color: #ff335b; display: flex; align-items: center; gap: 6px; }
        .pulse-dot { width: 7px; height: 7px; background: var(--iq-red); border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,0,51,0.8); } 70% { box-shadow: 0 0 0 8px rgba(255,0,51,0); } 100% { box-shadow: 0 0 0 0 rgba(255,0,51,0); } }

        /* تخطيط الشبكة المتجاوب */
        .app-layout {
            max-width: 1400px; margin: 0 auto; padding: 20px;
            display: grid; grid-template-columns: 1fr 360px; gap: 20px;
        }

        .workspace { display: flex; flex-direction: column; gap: 15px; min-width: 0; }

        .player-card {
            background: var(--bg-surface); border: 1px solid var(--glass-border);
            border-radius: 16px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            display: flex; flex-direction: column;
        }

        .player-top-bar {
            padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--glass-border); background: rgba(0,0,0,0.2);
            flex-wrap: wrap; gap: 10px;
        }

        .active-channel-info h2 { font-size: 16px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 8px; word-break: break-all; }
        
        .player-actions-group { display: flex; gap: 8px; }
        .action-icon-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: #fff; width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: var(--transition); font-size: 14px; }
        .action-icon-btn:hover { background: var(--iq-red); border-color: var(--iq-red); }

        .video-container {
            width: 100%; aspect-ratio: 16 / 9; background: #000; position: relative;
        }
        #player { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

        .sidebar-panel {
            background: var(--bg-surface); border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px;
            height: fit-content; max-height: calc(100vh - 100px); position: sticky; top: 80px;
        }

        .panel-tabs { display: flex; background: rgba(0,0,0,0.3); padding: 3px; border-radius: 10px; gap: 4px; }
        .tab-btn { flex: 1; padding: 8px; text-align: center; background: transparent; border: none; color: var(--text-muted); font-weight: 700; font-size: 12px; border-radius: 8px; cursor: pointer; transition: var(--transition); }
        .tab-btn.active { background: var(--iq-red); color: #fff; box-shadow: 0 4px 12px var(--iq-red-glow); }

        .search-wrapper { position: relative; }
        .search-wrapper input {
            width: 100%; background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border);
            border-radius: 10px; padding: 9px 12px 9px 36px; color: #fff; font-size: 12px; outline: none; transition: var(--transition);
        }
        .search-wrapper input:focus { border-color: var(--iq-red); }
        .search-wrapper i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 12px; }

        .channels-scroll-list {
            display: flex; flex-direction: column; gap: 8px; overflow-y: auto; max-height: 500px; padding-right: 2px;
        }

        .channel-row-card {
            background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border);
            padding: 8px 12px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between;
            cursor: pointer; transition: var(--transition);
        }
        .channel-row-card:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.15); }
        .channel-row-card.active { background: rgba(255, 0, 51, 0.08); border-color: var(--iq-red); }

        .channel-meta { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
        .ch-logo-box { width: 38px; height: 26px; background: rgba(255,255,255,0.03); border-radius: 5px; display: flex; align-items: center; justify-content: center; padding: 2px; flex-shrink: 0; }
        .ch-logo-box img { width: 100%; height: 100%; object-fit: contain; opacity: 0.7; }
        .channel-row-card:hover img, .channel-row-card.active img { opacity: 1; }
        
        .channel-row-card h4 { font-size: 12px; font-weight: 700; color: var(--text-muted); transition: var(--transition); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .channel-row-card.active h4 { color: #fff; }

        .fav-star-btn { background: transparent; border: none; color: var(--text-muted); font-size: 15px; cursor: pointer; padding: 4px; transition: var(--transition); flex-shrink: 0; }
        .fav-star-btn:hover, .fav-star-btn.is-fav { color: #ffc107; transform: scale(1.15); }

        footer { text-align: center; padding: 20px; border-top: 1px solid var(--glass-border); margin-top: 30px; color: var(--text-muted); font-size: 12px; }

        @media (max-width: 1024px) {
            .app-layout { grid-template-columns: 1fr; padding: 10px; gap: 15px; }
            .sidebar-panel { position: static; max-height: none; }
            .channels-scroll-list { max-height: 350px; }
        }

        @media (max-width: 480px) {
            header { padding: 10px 15px; }
            .logo { font-size: 20px; }
            .logo .tv-badge { font-size: 15px; padding: 1px 5px; }
            .live-badge-global { font-size: 11px; padding: 4px 10px; }
            .active-channel-info h2 { font-size: 14px; }
        }
    </style>
</head>
<body>

            </div>

            <div class="channels-scroll-list" id="channelsContainer">

    <!-- مشغل Clappr -->
    <script src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>

    <script>
        // حماية الأكواد ومنع فحص العناصر
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('keydown', event => {
            if (
                event.key === 'F12' || 
                (event.ctrlKey && event.shiftKey && (event.key === 'I' || event.key === 'J' || event.key === 'C')) || 
                (event.ctrlKey && event.key === 'U')
            ) {
                event.preventDefault();
                return false;
            }
        });

        let player = null;
        let activeApiUrl = '';
        let activeTitle = '';
        let currentTab = 'all';
        let favorites = JSON.parse(localStorage.getItem('iq_tv_favs')) || [];

        window.onload = () => {
            updateFavoritesUI();
            const firstCard = document.querySelector('.channel-row-card');
            if (firstCard) {
                selectChannelCard(firstCard.querySelector('.channel-meta'));
            }
        };

        async function selectChannelCard(metaEl) {
            const card = metaEl.closest('.channel-row-card');
            const apiUrl = card.getAttribute('data-url');
            const title = card.getAttribute('data-title');

            activeApiUrl = apiUrl;
            activeTitle = title;

            document.querySelectorAll('.channel-row-card').forEach(c => c.classList.remove('active'));
            card.classList.add('active');

            const titleEl = document.getElementById('current-channel-text');
            titleEl.innerHTML = `<i class="fa-solid fa-satellite-dish" style="color:var(--iq-red)"></i> ${title} <span style="font-size:11px; color:var(--text-muted); font-weight:400;">(جاري الاتصال...)</span>`;

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data && data.data && data.data.length > 0 && data.data[0].url) {
                    const rawUrl = data.data[0].url;
                    const proxyUrl = "https://iqtv-proxy.aaa317198.workers.dev?stream=" + encodeURIComponent(rawUrl);

                    titleEl.innerHTML = `<i class="fa-solid fa-satellite-dish" style="color:var(--iq-red)"></i> ${title}`;

                    if (player) player.destroy();

                    player = new Clappr.Player({
                        source: proxyUrl,
                        mimeType: 'application/x-mpegURL',
                        parentId: "#player",
                        width: '100%',
                        height: '100%',
                        autoPlay: true,
                        playback: {
                            playInline: true,
                            hlsjsConfig: {
                                maxMaxBufferLength: 25,
                                fragLoadingTimeOut: 45000,
                                manifestLoadingTimeOut: 45000,
                                fragLoadingMaxRetry: 10
                            }
                        }
                    });

                    setTimeout(() => {
                        const liveElements = document.querySelectorAll('.media-control [data-live], .live-pin, span');
                        liveElements.forEach(el => {
                            if (el.innerText === 'LIVE' || el.textContent === 'LIVE') {
                                el.innerText = 'IQ TV';
                            }
                        });
                    }, 1500);

                } else {
                    titleEl.innerText = `${title} (عذراً، البث متوقف حالياً)`;
                }
            } catch (err) {
                console.error(err);
                titleEl.innerText = `${title} (فشل الاتصال بالسيرفر)`;
            }
        }

        function toggleFavorite(e, channelId) {
            e.stopPropagation();
            const index = favorites.indexOf(channelId);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(channelId);
            }
            localStorage.setItem('iq_tv_favs', JSON.stringify(favorites));
            updateFavoritesUI();
            if (currentTab === 'fav') renderTabsContent();
        }

        function updateFavoritesUI() {
            document.querySelectorAll('.channel-row-card').forEach(card => {
                const id = card.getAttribute('data-id');
                const btn = card.querySelector('.fav-star-btn i');
                if (favorites.includes(id)) {
                    btn.className = "fa-solid fa-star";
                    btn.closest('button').classList.add('is-fav');
                } else {
                    btn.className = "fa-regular fa-star";
                    btn.closest('button').classList.remove('is-fav');
                }
            });
        }

        function switchTab(tab, btnEl) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btnEl.classList.add('active');
            renderTabsContent();
        }

        function renderTabsContent() {
            const cards = document.querySelectorAll('.channel-row-card');
            cards.forEach(card => {
                const id = card.getAttribute('data-id');
                if (currentTab === 'fav') {
                    if (favorites.includes(id)) {
                        card.style.display = "flex";
                    } else {
                        card.style.display = "none";
                    }
                } else {
                    card.style.display = "flex";
                }
            });
        }

        function filterChannelsQuery() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.channel-row-card');
            cards.forEach(card => {
                const name = card.getAttribute('data-name');
                if (name.includes(query)) {
                    if (currentTab === 'all' || (currentTab === 'fav' && favorites.includes(card.getAttribute('data-id')))) {
                        card.style.display = "flex";
                    }
                } else {
                    card.style.display = "none";
                }
            });
        }

        function reloadActiveStream() {
            if (activeApiUrl) {
                const activeCard = document.querySelector(`.channel-row-card[data-url="${activeApiUrl}"]`);
                if (activeCard) selectChannelCard(activeCard.querySelector('.channel-meta'));
            }
        }

        function toggleFullScreen() {
            const container = document.getElementById('video-container');
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(err => alert("خطأ في تفعيل ملء الشاشة"));
            } else {
                document.exitFullscreen();
            }
        }
    </script>
</body>
</html>
