<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>IQ TV</title>
    
    <!-- أيقونة التبويب -->
    <link rel="icon" type="image/png" sizes="32x32" href="https://i.ibb.co/4nnjf7tz/IQTV-Unified-Black.png">
    <link rel="apple-touch-icon" sizes="180x180" href="https://i.ibb.co/4nnjf7tz/IQTV-Unified-Black.png">
    
    <!-- الخطوط والأيقونات -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        :root {
            --primary: #FF0033;
            --primary-glow: rgba(255, 0, 51, 0.35);
            --bg-dark: #07080b;
            --bg-card: #10121a;
            --bg-card-hover: #161924;
            --surface-glass: rgba(18, 21, 31, 0.6);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-glass-bright: rgba(255, 255, 255, 0.18);
            --text-main: #ffffff;
            --text-sub: #9ca3af;
            --radius-xl: 18px;
            --radius-lg: 12px;
            --radius-md: 8px;
            --transition: all 0.25s ease;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Cairo', sans-serif; 
            user-select: none; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        body { 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            line-height: 1.4; 
            min-height: 100vh;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, rgba(255, 0, 51, 0.08) 0%, transparent 60%);
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }

        /* الهيدر الرئيسي */
        header {
            background: rgba(7, 8, 11, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 10px 5%;
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            position: sticky; 
            top: 0; 
            z-index: 100;
            border-bottom: 1px solid var(--border-glass);
            height: 60px;
        }

        .brand-logo { 
            display: flex; 
            align-items: center; 
            text-decoration: none;
            height: 100%;
        }
        
        .brand-logo img {
            height: 32px;
            width: auto;
            max-width: 140px;
            object-fit: contain;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* زر تحميل التطبيق في الهيدر */
        .download-btn-header {
            background: linear-gradient(135deg, var(--primary), #e6002e);
            color: #fff;
            padding: 6px 14px;
            border-radius: var(--radius-lg);
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 12px var(--primary-glow);
            transition: var(--transition);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .download-btn-header:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 18px var(--primary-glow);
        }

        .status-pill {
            background: rgba(255, 0, 51, 0.1); 
            border: 1px solid rgba(255, 0, 51, 0.25);
            padding: 4px 12px; 
            border-radius: 20px; 
            font-size: 11px; 
            font-weight: 700; 
            color: #ff4d6d;
            display: flex; 
            align-items: center; 
            gap: 6px;
            white-space: nowrap;
        }
        
        .pulse-dot { 
            width: 7px; 
            height: 7px; 
            background: var(--primary); 
            border-radius: 50%; 
            animation: pulse 1.5s infinite; 
        }
        
        @keyframes pulse { 
            0% { box-shadow: 0 0 0 0 rgba(255,0,51,0.7); } 
            70% { box-shadow: 0 0 0 6px rgba(255,0,51,0); } 
            100% { box-shadow: 0 0 0 0 rgba(255,0,51,0); } 
        }

        /* الحاوية الرئيسية */
        .container { max-width: 1200px; margin: 0 auto; padding: 20px 15px; }

        /* أدوات التبويب والبحث */
        .toolbar {
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            gap: 12px;
            margin-bottom: 24px; 
            background: var(--surface-glass);
            border: 1px solid var(--border-glass); 
            padding: 8px; 
            border-radius: var(--radius-xl);
            flex-wrap: wrap;
        }

        .tabs-group { display: flex; gap: 4px; background: rgba(0,0,0,0.3); padding: 4px; border-radius: var(--radius-lg); width: fit-content; }
        
        .tab-btn {
            background: transparent; 
            border: none; 
            color: var(--text-sub);
            padding: 8px 16px; 
            border-radius: var(--radius-md); 
            font-weight: 700; 
            font-size: 12px;
            cursor: pointer; 
            transition: var(--transition); 
            display: flex; 
            align-items: center; 
            gap: 6px;
            white-space: nowrap;
        }
        
        .tab-btn.active { background: var(--primary); color: #fff; box-shadow: 0 2px 10px var(--primary-glow); }

        .search-box { position: relative; flex: 1; min-width: 200px; }
        
        .search-box input {
            width: 100%; 
            background: rgba(0, 0, 0, 0.35); 
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg); 
            padding: 8px 12px 8px 36px; 
            color: #fff; 
            font-size: 12px;
            outline: none; 
            transition: var(--transition);
        }
        
        .search-box input:focus { border-color: var(--primary); }
        .search-box i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-sub); font-size: 12px; }

        /* شبكة عرض القنوات */
        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }

        .channel-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-xl);
            padding: 12px;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: space-between;
            cursor: pointer; 
            transition: var(--transition); 
            position: relative;
            height: 140px;
        }

        .channel-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-glass-bright);
            transform: translateY(-3px);
        }

        .fav-btn {
            position: absolute; top: 8px; left: 8px;
            background: rgba(0,0,0,0.4); border: 1px solid var(--border-glass);
            color: var(--text-sub); width: 28px; height: 28px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: var(--transition); z-index: 2; font-size: 11px;
        }
        .fav-btn:hover, .fav-btn.active { color: #ffc107; background: rgba(0,0,0,0.7); }

        .logo-container {
            width: 100%; flex: 1; display: flex; align-items: center; justify-content: center; padding: 5px 0;
        }
        .logo-container img {
            max-width: 90px; max-height: 45px; object-fit: contain;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
        }

        .channel-title {
            width: 100%; text-align: center; border-top: 1px solid var(--border-glass);
            padding-top: 8px; font-size: 12px; font-weight: 700; color: #fff;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* المشغل المنبثق الكامل */
        .player-modal {
            position: fixed; inset: 0; background: rgba(3, 4, 6, 0.96);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            z-index: 2000; display: none; flex-direction: column; opacity: 0; transition: opacity 0.25s ease;
        }
        .player-modal.open { display: flex; opacity: 1; }

        .modal-header {
            padding: 12px 4%; display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.4); border-bottom: 1px solid var(--border-glass);
            height: 56px;
        }

        .channel-meta { display: flex; align-items: center; gap: 8px; }
        .channel-meta h3 { font-size: 14px; font-weight: 700; color: #fff; }

        .close-player-btn {
            background: rgba(255, 255, 255, 0.08); border: 1px solid var(--border-glass); color: #fff;
            width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: var(--transition); font-size: 14px;
        }
        .close-player-btn:hover { background: var(--primary); border-color: var(--primary); }

        .modal-body { flex: 1; display: flex; align-items: center; justify-content: center; padding: 10px; }

        .video-box {
            width: 100%; max-width: 1000px; aspect-ratio: 16 / 9; background: #000;
            border-radius: var(--radius-xl); overflow: hidden; border: 1px solid var(--border-glass);
        }
        #player { width: 100%; height: 100%; }

        .floating-controls {
            padding: 10px; display: flex; justify-content: center; gap: 10px;
            background: rgba(0,0,0,0.5); border-top: 1px solid var(--border-glass);
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.08); border: 1px solid var(--border-glass); color: #fff;
            padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; gap: 6px; transition: var(--transition);
        }
        .control-btn:hover { background: var(--primary); border-color: var(--primary); }

        footer { text-align: center; padding: 20px; border-top: 1px solid var(--border-glass); margin-top: 40px; color: var(--text-sub); font-size: 12px; }

        /* التجاوب والتنسيق للهواتف الذكية */
        @media (max-width: 600px) {
            header { padding: 8px 12px; height: 52px; }
            .brand-logo img { height: 24px; }
            .status-pill { display: none; }
            .download-btn-header { padding: 5px 10px; font-size: 11px; }

            .toolbar { flex-direction: column; align-items: stretch; gap: 10px; background: transparent; border: none; padding: 0; }
            .tabs-group { width: 100%; }
            .tab-btn { flex: 1; justify-content: center; padding: 8px; }
            .search-box { width: 100%; }

            .channels-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .channel-card { height: 120px; padding: 10px; border-radius: var(--radius-lg); }
            .logo-container img { max-width: 70px; max-height: 35px; }
            .channel-title { font-size: 11px; padding-top: 5px; }

            .video-box { border-radius: 0; border: none; }
            .control-btn { padding: 6px 10px; font-size: 11px; }
        }
    </style>
</head>

    <script src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>

    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('keydown', event => {
            if (
                event.key === 'F12' || 
                (event.ctrlKey && event.shiftKey && (event.key === 'I' || event.key === 'J' || event.key === 'C')) || 
                (event.ctrlKey && event.key === 'U')
            ) {
                event.preventDefault();
                return false;
            }
            if (event.key === 'Escape') closePlayer();
        });

        let player = null;
        let currentChannelId = null;
        let currentTab = 'all';
        let favorites = JSON.parse(localStorage.getItem('iq_tv_favs')) || [];

        window.onload = () => {
            updateFavoritesUI();
        };

        const channelCards = Array.from(document.querySelectorAll('.channel-card'));

        async function openPlayer(channelId) {
            currentChannelId = channelId;
            const card = document.querySelector(`.channel-card[data-id="${channelId}"]`);
            if (!card) return;

            const apiUrl = card.getAttribute('data-url');
            const title = card.getAttribute('data-title');
            const modal = document.getElementById('playerModal');
            const modalTitle = document.getElementById('modalChannelTitle');

            modalTitle.innerText = `${title} (جاري الاتصال...)`;
            modal.classList.add('open');

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data && data.data && data.data.length > 0 && data.data[0].url) {
                    const rawUrl = data.data[0].url;
                    const proxyUrl = "https://iqtv-proxy.aaa317198.workers.dev?stream=" + encodeURIComponent(rawUrl);

                    modalTitle.innerText = title;

                    if (player) player.destroy();

                    player = new Clappr.Player({
                        source: proxyUrl,
                        mimeType: 'application/x-mpegURL',
                        parentId: "#player",
                        width: '100%',
                        height: '100%',
                        autoPlay: true,
                        playback: {
                            playInline: true,
                            hlsjsConfig: {
                                maxMaxBufferLength: 25,
                                fragLoadingTimeOut: 45000,
                                manifestLoadingTimeOut: 45000,
                                fragLoadingMaxRetry: 10
                            }
                        }
                    });

                } else {
                    modalTitle.innerText = `${title} (البث غير متوفر حالياً)`;
                }
            } catch (err) {
                console.error(err);
                modalTitle.innerText = `${title} (خطأ في الاتصال)`;
            }
        }

        function closePlayer() {
            const modal = document.getElementById('playerModal');
            modal.classList.remove('open');
            if (player) {
                player.destroy();
                player = null;
            }
        }

        function navigateChannel(direction) {
            const visibleCards = channelCards.filter(c => c.style.display !== 'none');
            const currentIndex = visibleCards.findIndex(c => c.getAttribute('data-id') === currentChannelId);
            
            if (currentIndex === -1) return;

            let nextIndex = direction === 'next' 
                ? (currentIndex + 1) % visibleCards.length 
                : (currentIndex - 1 + visibleCards.length) % visibleCards.length;

            openPlayer(visibleCards[nextIndex].getAttribute('data-id'));
        }

        function reloadActiveStream() {
            if (currentChannelId) openPlayer(currentChannelId);
        }

        function toggleFavorite(e, channelId) {
            e.stopPropagation();
            const index = favorites.indexOf(channelId);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(channelId);
            }
            localStorage.setItem('iq_tv_favs', JSON.stringify(favorites));
            updateFavoritesUI();
            if (currentTab === 'fav') renderTabsContent();
        }

        function updateFavoritesUI() {
            document.querySelectorAll('.channel-card').forEach(card => {
                const id = card.getAttribute('data-id');
                const btn = card.querySelector('.fav-btn');
                const icon = btn.querySelector('i');
                if (favorites.includes(id)) {
                    icon.className = "fa-solid fa-star";
                    btn.classList.add('active');
                } else {
                    icon.className = "fa-regular fa-star";
                    btn.classList.remove('active');
                }
            });
        }

        function switchTab(tab, btnEl) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btnEl.classList.add('active');
            renderTabsContent();
        }

        function renderTabsContent() {
            channelCards.forEach(card => {
                const id = card.getAttribute('data-id');
                card.style.display = (currentTab === 'fav') 
                    ? (favorites.includes(id) ? "flex" : "none") 
                    : "flex";
            });
        }

        function filterChannelsQuery() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            channelCards.forEach(card => {
                const name = card.getAttribute('data-name');
                const matchesSearch = name.includes(query);
                const matchesTab = currentTab === 'all' || favorites.includes(card.getAttribute('data-id'));
                
                card.style.display = (matchesSearch && matchesTab) ? "flex" : "none";
            });
        }
    </script>
</body>
</html>
