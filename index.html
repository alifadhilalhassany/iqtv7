<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IQ TV | منصة البث الرقمي المتقدمة</title>
    
    <!-- خطوط جوجل -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- مكتبة الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ==========================================
           1. المتغيرات والتهيئة الأساسية (Variables & Reset)
           ========================================== */
        :root {
            --primary: #FF0033;
            --primary-glow: rgba(255, 0, 51, 0.35);
            --bg-deep: #050608;
            --bg-surface: #0c0e14;
            --bg-card: #131620;
            --border-glass: rgba(255, 255, 255, 0.06);
            --text-main: #f8fafc;
            --text-muted: #8c95af;
            --radius-lg: 16px;
            --radius-md: 10px;
            --transition: all 0.25s ease-in-out;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* تخصيص شريط التمرير */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }

        /* ==========================================
           2. الترويسة الرئيسية (Header)
           ========================================== */
        header {
            background: rgba(5, 6, 8, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 14px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-glass);
        }

        .brand-logo {
            font-size: 22px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 4px;
            direction: ltr;
        }
        .brand-logo .text-white { color: #fff; }
        .brand-logo .badge-red {
            background: var(--primary);
            color: #fff;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 16px;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .status-pill {
            background: rgba(255, 0, 51, 0.1);
            border: 1px solid rgba(255, 0, 51, 0.25);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
            color: #ff335b;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--primary);
            border-radius: 50%;
            animation: pulse-glow 1.8s infinite;
        }

        @keyframes pulse-glow {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 0, 51, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(255, 0, 51, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 0, 51, 0); }
        }

        /* ==========================================
           3. التخطيط العام (App Grid Layout)
           ========================================== */
        .main-container {
            max-width: 1440px;
            width: 100%;
            margin: 0 auto;
            padding: 24px;
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
            flex: 1;
        }

        /* ==========================================
           4. قسم المشغل (Video Player Section)
           ========================================== */
        .player-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 0;
        }

        .player-wrapper-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .player-toolbar {
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.25);
            border-bottom: 1px solid var(--border-glass);
        }

        .current-channel-title {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .toolbar-actions {
            display: flex;
            gap: 8px;
        }

        .tool-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            font-size: 13px;
        }
        .tool-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 12px var(--primary-glow);
        }

        .video-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            position: relative;
        }
        #player {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* ==========================================
           5. الشريط الجانبي والقنوات (Sidebar & Channels)
           ========================================== */
        .sidebar-section {
            background: var(--bg-surface);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            height: fit-content;
            max-height: calc(100vh - 110px);
            position: sticky;
            top: 86px;
        }

        /* التبويبات */
        .tabs-group {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px;
            border-radius: 10px;
            gap: 4px;
        }
        .tab-item {
            flex: 1;
            padding: 8px;
            text-align: center;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
        }
        .tab-item.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        /* صندوق البحث */
        .search-box {
            position: relative;
        }
        .search-box input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            padding: 10px 12px 10px 38px;
            color: #fff;
            font-size: 12px;
            outline: none;
            transition: var(--transition);
        }
        .search-box input:focus {
            border-color: var(--primary);
        }
        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 12px;
        }

        /* قائمة القنوات */
        .channels-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            max-height: 480px;
            padding-right: 2px;
        }

        .channel-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            padding: 8px 12px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: var(--transition);
        }
        .channel-card:hover {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.12);
        }
        .channel-card.active {
            background: rgba(255, 0, 51, 0.08);
            border-color: var(--primary);
        }

        .channel-info-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .channel-logo-wrapper {
            width: 40px;
            height: 28px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2px;
            flex-shrink: 0;
        }
        .channel-logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0.65;
            transition: var(--transition);
        }
        .channel-card:hover img, .channel-card.active img {
            opacity: 1;
        }

        .channel-info-group h4 {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            transition: var(--transition);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .channel-card.active h4 {
            color: #fff;
        }

        .favorite-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 14px;
            cursor: pointer;
            padding: 6px;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .favorite-btn:hover, .favorite-btn.is-favorite {
            color: #fbbf24;
            transform: scale(1.15);
        }

        /* ==========================================
           6. التذييل (Footer)
           ========================================== */
        footer {
            text-align: center;
            padding: 20px;
            border-top: 1px solid var(--border-glass);
            color: var(--text-muted);
            font-size: 12px;
            background: var(--bg-surface);
            margin-top: auto;
        }

        /* ==========================================
           7. التجاوبية (Responsive Design)
           ========================================== */
        @media (max-width: 1024px) {
            .main-container {
                grid-template-columns: 1fr;
                padding: 14px;
            }
            .sidebar-section {
                position: static;
                max-height: none;
            }
            .channels-list {
                max-height: 340px;
            }
        }
    </style>
</head>

    <!-- مكتبة مشغل البث Clappr -->
    <script src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>

    <script>
        /* ==========================================
           الحماية وأمن الأكواد (Security Protections)
           ========================================== */
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (
                e.key === 'F12' || 
                (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) || 
                (e.ctrlKey && e.key.toUpperCase() === 'U')
            ) {
                e.preventDefault();
                return false;
            }
        });

        /* ==========================================
           إدارة حالة التطبيق والبث (App State & Logic)
           ========================================== */
        let mediaViewer = null;
        let activeEndpoint = '';
        let activeChannelTitle = '';
        let currentActiveTab = 'all';
        let userFavorites = JSON.parse(localStorage.getItem('iq_tv_favorites')) || [];

        // تهيئة التطبيق عند التحميل
        window.addEventListener('DOMContentLoaded', () => {
            syncFavoritesState();
            const defaultChannel = document.querySelector('.channel-card');
            if (defaultChannel) {
                selectChannel(defaultChannel.querySelector('.channel-info-group'));
            }
        });

        // اختيار قناة وتشغيلها
        async function selectChannel(infoElement) {
            const card = infoElement.closest('.channel-card');
            const endpointUrl = card.getAttribute('data-url');
            const channelName = card.getAttribute('data-title');

            activeEndpoint = endpointUrl;
            activeChannelTitle = channelName;

            // تحديث الواجهة وتحديد العنصر النشط
            document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
            card.classList.add('active');

            const titleContainer = document.getElementById('current-channel-text');
            titleContainer.innerHTML = `<i class="fa-solid fa-satellite-dish" style="color:var(--primary)"></i> <span>${channelName} (جاري الاتصال بالسيرفر...)</span>`;

            try {
                const response = await fetch(endpointUrl);
                const payload = await response.json();

                if (payload && payload.data && payload.data.length > 0 && payload.data[0].url) {
                    const rawStreamUrl = payload.data[0].url;
                    const proxyStreamUrl = "https://iqtv-proxy.aaa317198.workers.dev?stream=" + encodeURIComponent(rawStreamUrl);

                    titleContainer.innerHTML = `<i class="fa-solid fa-satellite-dish" style="color:var(--primary)"></i> <span>${channelName}</span>`;

                    if (mediaViewer) mediaViewer.destroy();

                    mediaViewer = new Clappr.Player({
                        source: proxyStreamUrl,
                        mimeType: 'application/x-mpegURL',
                        parentId: "#player",
                        width: '100%',
                        height: '100%',
                        autoPlay: true,
                        playback: {
                            playInline: true,
                            hlsjsConfig: {
                                maxMaxBufferLength: 20,
                                fragLoadingTimeOut: 40000,
                                manifestLoadingTimeOut: 40000,
                                fragLoadingMaxRetry: 6
                            }
                        }
                    });

                } else {
                    titleContainer.innerHTML = `<i class="fa-solid fa-triangle-exclamation" style="color:var(--primary)"></i> <span>${channelName} (البث غير متوفر حالياً)</span>`;
                }
            } catch (error) {
                console.error("Stream Fetch Error:", error);
                titleContainer.innerHTML = `<i class="fa-solid fa-triangle-exclamation" style="color:var(--primary)"></i> <span>${channelName} (تعذر الاتصال بقناة البث)</span>`;
            }
        }

        // إدارة المفضلة
        function toggleFavorite(event, channelId) {
            event.stopPropagation();
            const index = userFavorites.indexOf(channelId);
            
            if (index > -1) {
                userFavorites.splice(index, 1);
            } else {
                userFavorites.push(channelId);
            }
            
            localStorage.setItem('iq_tv_favorites', JSON.stringify(userFavorites));
            syncFavoritesState();
            
            if (currentActiveTab === 'fav') renderFilteredChannels();
        }

        // مزامنة أيقونات المفضلة مع التخزين المحلي
        function syncFavoritesState() {
            document.querySelectorAll('.channel-card').forEach(card => {
                const id = card.getAttribute('data-id');
                const starIcon = card.querySelector('.favorite-btn i');
                const starButton = card.querySelector('.favorite-btn');
                
                if (userFavorites.includes(id)) {
                    starIcon.className = "fa-solid fa-star";
                    starButton.classList.add('is-favorite');
                } else {
                    starIcon.className = "fa-regular fa-star";
                    starButton.classList.remove('is-favorite');
                }
            });
        }

        // التبديل بين علامات التبويب (الكل / المفضلة)
        function switchTab(tabKey, buttonElement) {
            currentActiveTab = tabKey;
            document.querySelectorAll('.tab-item').forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');
            renderFilteredChannels();
        }

        // تصفية وعرض القنوات بناءً على التبويب والبحث
        function renderFilteredChannels() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const cards = document.querySelectorAll('.channel-card');

            cards.forEach(card => {
                const channelName = card.getAttribute('data-name');
                const channelId = card.getAttribute('data-id');
                const matchesSearch = channelName.includes(query);
                const matchesTab = (currentActiveTab === 'all') || (currentActiveTab === 'fav' && userFavorites.includes(channelId));

                if (matchesSearch && matchesTab) {
                    card.style.display = "flex";
                } else {
                    card.style.display = "none";
                }
            });
        }

        // وظيفة البحث المباشر
        function filterChannels() {
            renderFilteredChannels();
        }

        // إعادة تحميل البث النشط
        function reloadActiveStream() {
            if (activeEndpoint) {
                const activeCard = document.querySelector(`.channel-card[data-url="${activeEndpoint}"]`);
                if (activeCard) {
                    selectChannel(activeCard.querySelector('.channel-info-group'));
                }
            }
        }

        // تفعيل وضع ملء الشاشة
        function toggleFullScreen() {
            const playerBox = document.getElementById('video-container');
            if (!document.fullscreenElement) {
                playerBox.requestFullscreen().catch(() => {
                    alert("عذراً، متصفحك لا يدعم وضع ملء الشاشة التلقائي.");
                });
            } else {
                document.exitFullscreen();
            }
        }
    </script>
</body>
</html>
